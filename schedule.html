<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN 행사 일정표</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #4a5d84;
    --blue: #3d63ff;
    --line: #e3e7ef;
    --paper: #f7f8fb;
  }

  body {
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    background: var(--paper);
    overflow-x: hidden;
    padding: 64px 20px 100px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(10,31,68,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 0%, black, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 10; max-width: 1080px; margin: 0 auto; }

  .bg-logo {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(60vw, 480px); height: min(60vw, 480px);
    border-radius: 50%; object-fit: cover; opacity: 0.04;
    filter: grayscale(1) contrast(1.1); pointer-events: none; z-index: 0;
  }

  .back-btn {
    position: fixed; top: 22px; left: 22px; z-index: 20;
    color: var(--navy); text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 10px 18px 10px 14px; border-radius: 100px;
    border: 2px solid var(--navy); background: #fff;
    transition: all 0.25s ease;
  }
  .back-btn:hover { color: #fff; background: var(--navy); transform: translateX(-3px); }

  .header { text-align: center; margin-bottom: 8px; animation: fadeDown 0.8s ease-out both; }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 100px;
    background: var(--navy); color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
    margin-bottom: 22px;
  }
  .badge-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .title {
    font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
    font-size: 52px; font-weight: 900; letter-spacing: -0.5px;
    color: var(--navy); line-height: 1.1;
  }
  .title span { color: var(--blue); }

  .subtitle { color: var(--navy-soft); margin-top: 16px; font-size: 15px; font-weight: 500; }

  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 10px;
    margin: 36px 0 8px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; color: var(--navy-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 100px;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  .cal {
    background: #ffffff;
    border: 2px solid var(--navy);
    border-radius: 20px;
    box-shadow: 6px 6px 0 var(--navy);
    padding: 24px 24px 28px;
    margin-top: 30px;
    animation: cardIn 0.7s ease-out both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cal-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 18px;
  }
  .cal-month {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 700; color: var(--navy); letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .cal-year {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 1px;
    background: var(--blue); padding: 4px 10px; border-radius: 100px;
  }

  .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays div {
    text-align: center; font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: var(--navy-soft); padding: 6px 0; text-transform: uppercase;
  }
  .weekdays .sun { color: #e0475c; }
  .weekdays .sat { color: var(--blue); }

  .day {
    min-height: 86px;
    border-radius: 10px;
    background: var(--paper);
    padding: 6px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .day.empty { background: transparent; }
  .day .date {
    align-self: flex-start;
    font-size: 13px; font-weight: 700; color: var(--navy);
    padding: 1px 5px; border-radius: 6px;
  }
  .day .date.sun { color: #e0475c; }
  .day .date.sat { color: var(--blue); }

  .badge {
    width: 100%;
    font-size: 10px; font-weight: 700; line-height: 1.3;
    text-align: center; color: #fff;
    border-radius: 6px; padding: 3px 4px;
    background: var(--bc);
  }
  .badge.alt {
    background: transparent;
    color: var(--bc);
    border: 1px dashed var(--bc);
  }

  .cal-empty {
    text-align: center; margin-top: 14px;
    font-size: 13px; color: var(--navy-soft); letter-spacing: 0.5px;
  }

  @media (max-width: 700px) {
    .title { font-size: 38px; }
    .cal { padding: 16px 12px 20px; }
    .cal-month { font-size: 20px; }
    .day { min-height: 62px; padding: 4px 3px; }
    .day .date { font-size: 11px; }
    .badge { font-size: 8px; padding: 2px 2px; }
  }
</style>
</head>
<body>
  <img class="bg-logo" src="핀스킨 로고.png" alt="">

  <a class="back-btn" href="main.html">← BACK</a>

  <div class="wrap">
    <div class="header">
      <div class="badge-pill"><span class="dot"></span>PINSKIN CLUB</div>
      <h1 class="title">행사 일정표</h1>
      <p class="subtitle">— 2026년 2학기 —</p>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#0a1f44;"></span>조사 · 준비</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3d63ff;"></span>진행</div>
      <div class="legend-item"><span class="legend-dot" style="background:#2f9e44;"></span>회의</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff9f45;"></span>선발</div>
      <div class="legend-item"><span class="legend-dot" style="background:#7b2dff;"></span>총회</div>
      <div class="legend-item"><span class="legend-dot" style="background:#00a3a3;"></span>엠티</div>
      <div class="legend-item"><span class="legend-dot" style="background:#00a3d4;"></span>세미나</div>
      <div class="legend-item"><span class="legend-dot" style="background:#e0475c;"></span>공휴일</div>
    </div>

    <div id="calContainer"></div>
  </div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }

    var rng = function (a, b) {
      var out = [];
      for (var i = a; i <= b; i++) out.push(i);
      return out;
    };

    var monthNames = { 8: '8월', 9: '9월', 10: '10월', 11: '11월', 12: '12월' };

    var months = [
      {
        key: 8, days: 31, offset: 6,
        events: (function () {
          var e = {};
          return e;
        })()
      },
      {
        key: 9, days: 30, offset: 2,
        events: (function () {
          var e = {};
          e[1] = [{ label: '운영진 회의 (오후 7시·동아리방)', color: '#2f9e44' }];
          rng(9, 10).forEach(function (d) { e[d] = [{ label: '가두모집 진행', color: '#3d63ff' }]; });
          rng(11, 12).forEach(function (d) { e[d] = [{ label: '신입부원 선발', color: '#ff9f45' }]; });
          rng(12, 13).forEach(function (d) { e[d] = (e[d] || []).concat([{ label: '개강총회·환영회 참여 조사', color: '#0a1f44' }]); });
          e[17] = [{ label: '개강총회·환영회 진행', color: '#7b2dff' }];
          rng(20, 22).forEach(function (d) { e[d] = [{ label: '자율스터디·세미나 참여 조사', color: '#0a1f44' }]; });
          rng(24, 27).forEach(function (d) { e[d] = [{ label: '추석연휴', color: '#e0475c' }]; });
          e[30] = [{ label: '공모전·대외활동 세미나', color: '#00a3d4' }];
          return e;
        })()
      },
      {
        key: 10, days: 31, offset: 4,
        events: (function () {
          var e = {};
          e[3] = [{ label: '개천절', color: '#e0475c' }];
          e[5] = [{ label: '대체공휴일', color: '#e0475c' }];
          e[9] = [{ label: '한글날', color: '#e0475c' }];
          rng(12, 15).forEach(function (d) { e[d] = [{ label: '2학기 엠티 참여 조사', color: '#0a1f44' }]; });
          return e;
        })()
      },
      {
        key: 11, days: 30, offset: 0,
        events: (function () {
          var e = {};
          rng(7, 8).forEach(function (d) { e[d] = [{ label: '2학기 엠티 진행(1차)', color: '#00a3a3' }]; });
          rng(14, 15).forEach(function (d) { e[d] = [{ label: '2학기 엠티 진행(2차)', color: '#00a3a3' }]; });
          rng(17, 19).forEach(function (d) { e[d] = [{ label: '만족도 조사·회계 보고·종강총회 조사', color: '#0a1f44' }]; });
          e[25] = [{ label: '종강총회 진행', color: '#7b2dff' }];
          return e;
        })()
      },
      {
        key: 12, days: 31, offset: 2,
        events: {}
      }
    ];

    var container = document.getElementById('calContainer');

    months.forEach(function (month, idx) {
      var sec = document.createElement('section');
      sec.className = 'cal';
      sec.innerHTML =
        '<div class="cal-head"><div class="cal-month">' + monthNames[month.key] + '</div>' +
        '<div class="cal-year">2026</div></div>' +
        '<div class="weekdays"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>' +
        '<div class="cal-grid" id="grid-' + month.key + '"></div>';

      container.appendChild(sec);
      var grid = sec.querySelector('.cal-grid');
      var total = month.offset + month.days;
      var cells = Math.ceil(total / 7) * 7;

      for (var i = 0; i < cells; i++) {
        var dayNum = i - month.offset + 1;
        var wd = i % 7;
        var cell = document.createElement('div');
        if (dayNum < 1 || dayNum > month.days) {
          cell.className = 'day empty';
        } else {
          cell.className = 'day';
          var dateEl = document.createElement('div');
          dateEl.className = 'date' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
          dateEl.textContent = dayNum;
          cell.appendChild(dateEl);
          (month.events[dayNum] || []).forEach(function (ev) {
            var b = document.createElement('div');
            b.className = 'badge' + (ev.alt ? ' alt' : '');
            b.textContent = ev.label;
            b.style.setProperty('--bc', ev.color);
            cell.appendChild(b);
          });
        }
        grid.appendChild(cell);
      }

      if (month.key === 12) {
        var note = document.createElement('div');
        note.className = 'cal-empty';
        note.textContent = '— 12월은 예정된 행사가 없습니다 —';
        sec.appendChild(note);
      }
    });
  </script>
</body>
</html>
