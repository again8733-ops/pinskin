<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN - 접속</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #1e3a6e;
  }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    animation: floatBlob 16s ease-in-out infinite;
  }
  .blob1 { width: 45vw; height: 45vw; background: #dbe4ff; top: -15%; left: -12%; opacity: 0.9; }
  .blob2 { width: 40vw; height: 40vw; background: #cddcff; bottom: -18%; right: -10%; opacity: 0.85; animation-delay: -6s; }
  .blob3 { width: 28vw; height: 28vw; background: #f0e6ff; top: 45%; left: 52%; opacity: 0.7; animation-delay: -11s; }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.12); }
    66% { transform: translate(-4vw, 5vh) scale(0.92); }
  }

  .login-box {
    position: relative;
    z-index: 10;
    width: min(90vw, 420px);
    text-align: center;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 45px 40px 40px;
    border: 1px solid rgba(10,31,68,0.12);
    box-shadow: 0 30px 80px rgba(10,31,68,0.18);
    animation: popIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .login-box.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .lock-icon {
    width: 84px; height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #0a1f44, #1e3a6e);
    box-shadow: 0 12px 30px rgba(10,31,68,0.35);
    animation: lockFloat 3.5s ease-in-out infinite;
  }
  @keyframes lockFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .login-title {
    font-size: 26px; font-weight: 900; letter-spacing: 2px; color: var(--navy);
  }
  .login-sub {
    margin-top: 8px; font-size: 13px; color: var(--navy-soft); letter-spacing: 2px;
  }

  .pw-wrap { position: relative; margin-top: 28px; }
  .pw-input {
    width: 100%;
    padding: 16px 20px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 6px;
    text-align: center;
    color: var(--navy);
    background: #f3f6ff;
    border: 2px solid rgba(10,31,68,0.18);
    border-radius: 16px;
    outline: none;
    transition: all 0.3s ease;
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
  }
  .pw-input:focus {
    border-color: var(--navy);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(10,31,68,0.1);
  }

  .pw-hint {
    margin-top: 10px;
    font-size: 12px;
    color: rgba(10,31,68,0.5);
    letter-spacing: 1px;
  }
  .error-msg {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #e74c3c;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .error-msg.show { opacity: 1; }

  .login-btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(100deg, #0a1f44, #1e3a6e, #ffc94a, #0a1f44);
    background-size: 260% 100%;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(10,31,68,0.3);
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .login-btn:hover { background-position: 100% 0; transform: translateY(-3px); box-shadow: 0 16px 40px rgba(10,31,68,0.4); }
  .login-btn:active { transform: scale(0.97); }
  .login-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .login-btn::before {
    content: '';
    position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -120%; }
    50%, 100% { left: 140%; }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="login-box" id="loginBox">
    <div class="lock-icon">🔒</div>
    <h1 class="login-title">PINSKIN</h1>
    <p class="login-sub">비밀번호를 입력해주세요</p>

    <div class="pw-wrap">
      <input class="pw-input" id="pwInput" type="password" placeholder="•••••••" autocomplete="off" maxlength="30">
    </div>
    <p class="pw-hint">회원 전용 페이지입니다.</p>
    <p class="error-msg" id="errorMsg">비밀번호가 올바르지 않습니다</p>

    <button class="login-btn" id="loginBtn">접속하기</button>
  </div>

  <script>
    (function () {
      var HASH = 'bdcec6b82751839d4c6248a3a6bad29c96e957a1f05ce120ce14f4fadd7eae3e';
      var box = document.getElementById('loginBox');
      var input = document.getElementById('pwInput');
      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('errorMsg');

      function toHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }

      function sha256(str) {
        if (window.crypto && crypto.subtle) {
          return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(toHex);
        }
        return Promise.reject(new Error('no-crypto'));
      }

      function fail() {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        err.classList.add('show');
        input.value = '';
        input.focus();
      }

      function enter() {
        var v = input.value.trim();
        if (!v) { input.focus(); return; }
        btn.disabled = true;
        err.classList.remove('show');
        sha256(v).then(function (h) {
          if (h === HASH) {
            sessionStorage.setItem('pinskin_auth', 'yes');
            location.replace('home.html');
          } else {
            btn.disabled = false;
            fail();
          }
        }).catch(function () {
          btn.disabled = false;
          fail();
        });
      }

      btn.addEventListener('click', enter);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') enter();
      });
      input.addEventListener('input', function () { err.classList.remove('show'); });
      input.focus();
    })();
  </script>
</body>
</html>
