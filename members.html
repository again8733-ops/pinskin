<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN Members Only</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #4a5d84;
    --blue: #3d63ff;
    --line: #e3e7ef;
    --paper: #f7f8fb;
  }

  body {
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    background: var(--paper);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(10,31,68,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 50%, black, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .wrap {
    position: relative; z-index: 10; text-align: center;
    animation: popIn 0.7s cubic-bezier(0.2,0.8,0.3,1) both;
    background: #fff;
    border: 2px solid var(--navy);
    box-shadow: 8px 8px 0 var(--navy);
    border-radius: 24px;
    padding: 56px 48px;
    max-width: 440px;
    margin: 20px;
  }
  .wrap.hidden { display: none; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9) translateY(24px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .wrap.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }

  .badge-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 100px;
    background: var(--navy); color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
    margin-bottom: 26px;
  }
  .badge-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .lock-icon {
    width: 62px; height: 62px; margin: 0 auto 20px;
    border-radius: 14px;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px; font-weight: 900; letter-spacing: -1px; color: var(--navy);
  }
  .title span { color: var(--blue); }

  .sub {
    margin-top: 14px;
    color: var(--navy-soft);
    font-size: 15px; font-weight: 500;
  }

  .pw-wrap { margin-top: 24px; }
  .pw-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 18px; font-weight: 700; letter-spacing: 6px;
    text-align: center;
    color: var(--navy);
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s ease;
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }
  .pw-input:focus { border-color: var(--navy); background: #fff; }

  .error-msg {
    margin-top: 10px; font-size: 12.5px; font-weight: 700; color: #e0475c;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .error-msg.show { opacity: 1; }

  .login-btn {
    display: block; width: 100%; margin-top: 18px; padding: 15px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    color: #fff; background: var(--navy);
    border: 2px solid var(--navy); border-radius: 12px;
    cursor: pointer; text-transform: uppercase;
    transition: all 0.25s ease;
  }
  .login-btn:hover { background: var(--blue); border-color: var(--blue); transform: translateY(-2px); }
  .login-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 36px;
    padding: 12px 30px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    color: #fff; text-decoration: none;
    border-radius: 100px;
    border: 2px solid var(--navy);
    background: var(--navy);
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    background: var(--blue);
    border-color: var(--blue);
    transform: translateY(-3px);
  }

  .dot-bounce span {
    display: inline-block;
    width: 8px; height: 8px; margin: 0 4px;
    border-radius: 50%;
    background: var(--navy);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot-bounce span:nth-child(2) { animation-delay: 0.15s; background: var(--blue); }
  .dot-bounce span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-12px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap" id="lockView">
    <div class="lock-icon">MO</div>
    <div class="badge-pill"><span class="dot"></span>PINSKIN_Members_Only</div>
    <h1 class="title">비밀번호 확인</h1>
    <p class="sub">회원 전용 공간입니다</p>

    <div class="pw-wrap">
      <input class="pw-input" id="pwInput" type="password" placeholder="••••••" autocomplete="off" maxlength="30">
    </div>
    <p class="error-msg" id="errorMsg">비밀번호가 올바르지 않습니다</p>

    <button class="login-btn" id="loginBtn">ENTER →</button>
  </div>

  <div class="wrap hidden" id="contentView">
    <div class="badge-pill"><span class="dot"></span>PINSKIN_Members_Only</div>
    <h1 class="title">준비 중입니다</h1>
    <p class="sub">회원 전용 공간을 준비하고 있어요</p>
    <div class="dot-bounce" style="margin-top: 26px;">
      <span></span><span></span><span></span>
    </div>
    <br>
    <a class="back-btn" href="main.html">← BACK</a>
  </div>

  <script>
    (function () {
      var HASH = '0f6e0d14f4a92e440b52fceace84e93f47dadfdd375c5a0d6a8d1c009dfa8c31';
      var lockView = document.getElementById('lockView');
      var contentView = document.getElementById('contentView');
      var input = document.getElementById('pwInput');
      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('errorMsg');

      function toHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }

      function sha256(str) {
        if (window.crypto && crypto.subtle) {
          return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(toHex);
        }
        return Promise.reject(new Error('no-crypto'));
      }

      function unlock() {
        lockView.classList.add('hidden');
        contentView.classList.remove('hidden');
      }

      function fail() {
        lockView.classList.remove('shake');
        void lockView.offsetWidth;
        lockView.classList.add('shake');
        err.classList.add('show');
        input.value = '';
        input.focus();
        btn.disabled = false;
      }

      function enter() {
        var v = input.value.trim();
        if (!v) { input.focus(); return; }
        btn.disabled = true;
        err.classList.remove('show');
        sha256(v).then(function (h) {
          if (h === HASH) {
            sessionStorage.setItem('pinskin_members_auth', 'yes');
            unlock();
          } else {
            fail();
          }
        }).catch(fail);
      }

      if (sessionStorage.getItem('pinskin_members_auth') === 'yes') {
        unlock();
      } else {
        btn.addEventListener('click', enter);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') enter();
        });
        input.addEventListener('input', function () { err.classList.remove('show'); });
        input.focus();
      }
    })();
  </script>
</body>
</html>
