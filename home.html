<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #1e3a6e;
    --gold: #ffc94a;
  }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 부드러운 네이비 그라데이션 블롭 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    animation: floatBlob 16s ease-in-out infinite;
  }
  .blob1 { width: 45vw; height: 45vw; background: #dbe4ff; top: -15%; left: -12%; opacity: 0.9; }
  .blob2 { width: 40vw; height: 40vw; background: #cddcff; bottom: -18%; right: -10%; opacity: 0.85; animation-delay: -6s; }
  .blob3 { width: 28vw; height: 28vw; background: #f0e6ff; top: 45%; left: 52%; opacity: 0.7; animation-delay: -11s; }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.12); }
    66% { transform: translate(-4vw, 5vh) scale(0.92); }
  }

  /* 떠다니는 네이비 입자 */
  .particle {
    position: absolute;
    bottom: -10px;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle, rgba(10,31,68,0.7), transparent);
    border-radius: 50%;
    opacity: 0.5;
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: fadeIn 1.4s ease-out both;
    padding: 0 20px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 로고 */
  .logo-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 18px;
  }
  .logo-ring {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 3px solid rgba(10,31,68,0.18);
    animation: ringPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .logo-ring.ring2 { inset: -36px; border-color: rgba(10,31,68,0.1); animation-delay: 1s; }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.45; }
  }

  .logo {
    width: min(38vw, 320px);
    height: min(38vw, 320px);
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 55px rgba(10,31,68,0.16),
      0 24px 55px rgba(10,31,68,0.2);
    border: 5px solid #ffffff;
    background: #fff;
    animation: logoFloat 5s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .club-name {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--navy);
    animation: slideUp 1s ease-out both;
    filter: drop-shadow(0 4px 14px rgba(10,31,68,0.15));
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    color: var(--navy-soft);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.7;
    margin-top: 14px;
    animation: slideUp 1.2s ease-out both;
    animation-delay: 0.3s;
  }

  /* 시작하기 버튼 */
  .start-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 17px 60px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-decoration: none;
    border-radius: 60px;
    background: linear-gradient(100deg, #0a1f44, #1e3a6e, #ffc94a, #0a1f44);
    background-size: 260% 100%;
    box-shadow: 0 12px 30px rgba(10,31,68,0.3);
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
    animation: slideUp 1.2s ease-out both;
    animation-delay: 0.6s;
    cursor: pointer;
    border: none;
  }
  .start-btn:hover {
    transform: translateY(-5px) scale(1.04);
    background-position: 100% 0;
    box-shadow: 0 18px 45px rgba(10,31,68,0.4);
  }
  .start-btn:active { transform: scale(0.96); }

  .start-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -120%; }
    50%, 100% { left: 140%; }
  }

  .scroll-hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(10,31,68,0.45);
    font-size: 12px;
    letter-spacing: 4px;
    animation: bounceHint 2s infinite;
    z-index: 10;
  }
  @keyframes bounceHint {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="content">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring ring2"></div>
      <img class="logo" src="핀스킨 로고.png" alt="PINSKIN 로고">
    </div>
    <h1 class="club-name">PINSKIN</h1>
    <p class="tagline">경상국립대학교 중앙동아리 소속<br>공모전 동아리</p>
    <br>
    <a class="start-btn" href="main.html">PINSKIN 시작하기</a>
  </div>

  <div class="scroll-hint">SCROLL TO BEGIN</div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }

    // 입자 생성
    const body = document.body;
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.width = p.style.height = (Math.random() * 5 + 2) + 'px';
      p.style.animationDuration = (Math.random() * 12 + 8) + 's';
      p.style.animationDelay = (Math.random() * 12) + 's';
      body.appendChild(p);
    }
  </script>
</body>
</html>
