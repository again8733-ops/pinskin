<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN 행사 일정표</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #1e3a6e;
  }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    overflow-x: hidden;
    padding: 60px 20px 100px;
    position: relative;
  }

  .blob {
    position: absolute; border-radius: 50%; filter: blur(100px);
    animation: floatBlob 16s ease-in-out infinite; pointer-events: none;
  }
  .blob1 { width: 40vw; height: 40vw; background: #dbe4ff; top: -10%; left: -10%; opacity: 0.9; }
  .blob2 { width: 35vw; height: 35vw; background: #cddcff; bottom: -10%; right: -5%; opacity: 0.85; animation-delay: -6s; }
  .blob3 { width: 25vw; height: 25vw; background: #f0e6ff; top: 45%; left: 55%; opacity: 0.7; animation-delay: -10s; }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.1); }
    66% { transform: translate(-4vw, 4vh) scale(0.92); }
  }

  .wrap { position: relative; z-index: 10; max-width: 1080px; margin: 0 auto; }

  /* 배경 워터마크 로고 */
  .bg-logo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(85vw, 640px);
    height: min(85vw, 640px);
    border-radius: 50%;
    object-fit: cover;
    opacity: 0.14;
    filter: blur(0.5px);
    pointer-events: none;
    z-index: 1;
    animation: bgPulse 8s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: 0.11; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.18; transform: translate(-50%, -50%) scale(1.04); }
  }

  .back-btn {
    position: fixed; top: 24px; left: 24px; z-index: 20;
    color: var(--navy); text-decoration: none; font-size: 15px; font-weight: 700;
    letter-spacing: 1px; padding: 10px 18px; border-radius: 40px;
    border: 1px solid rgba(10,31,68,0.25); background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px); transition: all 0.3s ease;
  }
  .back-btn:hover { color: #fff; background: var(--navy); border-color: var(--navy); transform: translateX(-4px); }

  .header { text-align: center; margin-bottom: 36px; animation: fadeDown 1s ease-out both; }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-size: 46px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #0a1f44, #1e3a6e, #4a6fb5, #0a1f44);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradientMove 6s linear infinite;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .subtitle { color: var(--navy-soft); letter-spacing: 6px; margin-top: 10px; font-size: 18px; }

  /* 범례 */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px;
    margin-bottom: 40px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 700; color: var(--navy-soft);
  }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; }

  .cal {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(10,31,68,0.14);
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(10,31,68,0.1);
    padding: 24px 24px 28px;
    margin-bottom: 34px;
    animation: cardIn 0.8s ease-out both;
  }
  .cal:nth-child(1) { animation-delay: 0.1s; }
  .cal:nth-child(2) { animation-delay: 0.2s; }
  .cal:nth-child(3) { animation-delay: 0.3s; }
  .cal:nth-child(4) { animation-delay: 0.4s; }
  .cal:nth-child(5) { animation-delay: 0.5s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cal-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-month { font-size: 26px; font-weight: 900; color: var(--navy); letter-spacing: 1px; }
  .cal-year { font-size: 14px; font-weight: 700; color: var(--navy-soft); letter-spacing: 2px; }

  .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays div {
    text-align: center; font-size: 13px; font-weight: 900;
    color: var(--navy-soft); padding: 6px 0;
  }
  .weekdays .sun { color: #e74c3c; }
  .weekdays .sat { color: #2f6fd6; }

  .day {
    min-height: 86px;
    border-radius: 12px;
    background: rgba(10,31,68,0.035);
    padding: 6px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .day.empty { background: transparent; }
  .day .date {
    align-self: flex-start;
    font-size: 14px; font-weight: 700; color: var(--navy);
    padding: 1px 5px; border-radius: 8px;
  }
  .day .date.sun { color: #e74c3c; }
  .day .date.sat { color: #2f6fd6; }

  .badge {
    width: 100%;
    font-size: 11px; font-weight: 700; line-height: 1.3;
    text-align: center; color: #fff;
    border-radius: 8px; padding: 3px 4px;
    background: var(--bc);
  }
  .badge.alt {
    background: transparent;
    color: var(--bc);
    border: 1px dashed var(--bc);
  }

  .cal-empty {
    text-align: center; margin-top: 14px;
    font-size: 14px; color: rgba(10,31,68,0.4); letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    .title { font-size: 28px; }
    .cal { padding: 16px 12px 20px; }
    .cal-month { font-size: 20px; }
    .day { min-height: 62px; padding: 4px 3px; }
    .day .date { font-size: 12px; }
    .badge { font-size: 9px; padding: 2px 2px; }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <img class="bg-logo" src="핀스킨 로고.png" alt="">

  <a class="back-btn" href="main.html">◀ 뒤로</a>

  <div class="wrap">
    <div class="header">
      <h1 class="title">PINSKIN 행사 일정표</h1>
      <p class="subtitle">— 2 0 2 6  S E M E S T E R  2 —</p>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#1e3a6e;"></span>조사 · 준비</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff2d95;"></span>진행</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff9f45;"></span>선발</div>
      <div class="legend-item"><span class="legend-dot" style="background:#7b2dff;"></span>총회</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ffb347;"></span>엠티</div>
      <div class="legend-item"><span class="legend-dot" style="background:#00a3d4;"></span>세미나</div>
      <div class="legend-item"><span class="legend-dot" style="background:#e74c3c;"></span>공휴일</div>
    </div>

    <div id="calContainer"></div>
  </div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }

    var rng = function (a, b) {
      var out = [];
      for (var i = a; i <= b; i++) out.push(i);
      return out;
    };

    var months = [
      {
        key: 8, days: 31, offset: 6,
        events: (function () {
          var e = {};
          rng(24, 31).forEach(function (d) { e[d] = [{ label: '운영진 인수인계·가두모집 준비', color: '#1e3a6e' }]; });
          return e;
        })()
      },
      {
        key: 9, days: 30, offset: 2,
        events: (function () {
          var e = {};
          rng(1, 7).forEach(function (d) { e[d] = [{ label: '운영진 인수인계·가두모집 준비', color: '#1e3a6e' }]; });
          rng(8, 9).forEach(function (d) { e[d] = [{ label: '가두모집 진행', color: '#ff2d95' }]; });
          rng(10, 11).forEach(function (d) { e[d] = [{ label: '신입부원 선발', color: '#ff9f45' }]; });
          rng(12, 13).forEach(function (d) { e[d] = [{ label: '개강총회·환영회 참여 조사', color: '#1e3a6e' }]; });
          e[16] = [{ label: '개강총회·환영회 진행', color: '#7b2dff' }];
          e[17] = [{ label: '개강총회(대체)', color: '#7b2dff', alt: true }];
          rng(20, 22).forEach(function (d) { e[d] = [{ label: '자율스터디·세미나 참여 조사', color: '#1e3a6e' }]; });
          rng(24, 27).forEach(function (d) { e[d] = [{ label: '추석연휴', color: '#e74c3c' }]; });
          e[30] = [{ label: '공모전·대외활동 세미나', color: '#00a3d4' }];
          return e;
        })()
      },
      {
        key: 10, days: 31, offset: 4,
        events: (function () {
          var e = {};
          e[3] = [{ label: '개천절', color: '#e74c3c' }];
          e[5] = [{ label: '대체공휴일', color: '#e74c3c' }];
          e[9] = [{ label: '한글날', color: '#e74c3c' }];
          rng(12, 15).forEach(function (d) { e[d] = [{ label: '2학기 엠티 참여 조사', color: '#1e3a6e' }]; });
          return e;
        })()
      },
      {
        key: 11, days: 30, offset: 0,
        events: (function () {
          var e = {};
          rng(7, 8).forEach(function (d) { e[d] = [{ label: '2학기 엠티 진행(1차)', color: '#ffb347' }]; });
          rng(14, 15).forEach(function (d) { e[d] = [{ label: '2학기 엠티 진행(2차)', color: '#ffb347' }]; });
          rng(17, 19).forEach(function (d) { e[d] = [{ label: '만족도 조사·회계 보고·종강총회 조사', color: '#1e3a6e' }]; });
          e[25] = [{ label: '종강총회 진행', color: '#7b2dff' }];
          return e;
        })()
      },
      {
        key: 12, days: 31, offset: 2,
        events: {}
      }
    ];

    var container = document.getElementById('calContainer');

    months.forEach(function (month, idx) {
      var sec = document.createElement('section');
      sec.className = 'cal';
      sec.innerHTML =
        '<div class="cal-head"><div class="cal-month">' + month.key + '월</div>' +
        '<div class="cal-year">2026</div></div>' +
        '<div class="weekdays"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>' +
        '<div class="cal-grid" id="grid-' + month.key + '"></div>';

      container.appendChild(sec);
      var grid = sec.querySelector('.cal-grid');
      var total = month.offset + month.days;
      var cells = Math.ceil(total / 7) * 7;

      for (var i = 0; i < cells; i++) {
        var dayNum = i - month.offset + 1;
        var wd = i % 7;
        var cell = document.createElement('div');
        if (dayNum < 1 || dayNum > month.days) {
          cell.className = 'day empty';
        } else {
          cell.className = 'day';
          var dateEl = document.createElement('div');
          dateEl.className = 'date' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
          dateEl.textContent = dayNum;
          cell.appendChild(dateEl);
          (month.events[dayNum] || []).forEach(function (ev) {
            var b = document.createElement('div');
            b.className = 'badge' + (ev.alt ? ' alt' : '');
            b.textContent = ev.label;
            b.style.setProperty('--bc', ev.color);
            cell.appendChild(b);
          });
        }
        grid.appendChild(cell);
      }

      if (month.key === 12) {
        var note = document.createElement('div');
        note.className = 'cal-empty';
        note.textContent = '— 12월은 예정된 행사가 없습니다 —';
        sec.appendChild(note);
      }
    });
  </script>
</body>
</html>
