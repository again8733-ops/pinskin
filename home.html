<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #1e3a6e;
    --gold: #ffc94a;
  }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(1100px 620px at 82% -5%, rgba(88,72,190,0.30), transparent 60%),
      radial-gradient(900px 560px at 8% 108%, rgba(30,58,110,0.55), transparent 60%),
      linear-gradient(180deg, #060c22 0%, #0a1f44 50%, #16305e 100%);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 은하 성운 블롭 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    animation: floatBlob 16s ease-in-out infinite;
  }
  .blob1 { width: 45vw; height: 45vw; background: rgba(88,72,190,0.20); top: -15%; left: -12%; opacity: 0.9; }
  .blob2 { width: 40vw; height: 40vw; background: rgba(0,110,220,0.14); bottom: -18%; right: -10%; opacity: 0.85; animation-delay: -6s; }
  .blob3 { width: 28vw; height: 28vw; background: rgba(74,111,181,0.18); top: 45%; left: 52%; opacity: 0.7; animation-delay: -11s; }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.12); }
    66% { transform: translate(-4vw, 5vh) scale(0.92); }
  }

  /* 떠다니는 별 입자 */
  .particle {
    position: absolute;
    bottom: -10px;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent);
    border-radius: 50%;
    opacity: 0.5;
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
  }

  /* 은하계 배경 */
  .campus-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    display: block;
  }

  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: fadeIn 1.4s ease-out both;
    padding: 0 20px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 로고 */
  .logo-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 18px;
  }
  .logo-ring {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 3px solid rgba(219,228,255,0.35);
    animation: ringPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .logo-ring.ring2 { inset: -36px; border-color: rgba(219,228,255,0.2); animation-delay: 1s; }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.45; }
  }

  .logo {
    width: min(38vw, 320px);
    height: min(38vw, 320px);
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 60px rgba(176,196,255,0.35),
      0 24px 55px rgba(0,0,0,0.5);
    border: 5px solid #ffffff;
    background: #fff;
    animation: logoFloat 5s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .club-name {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffffff;
    animation: slideUp 1s ease-out both;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.55)) drop-shadow(0 0 24px rgba(74,111,181,0.5));
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    color: rgba(219,228,255,0.92);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.7;
    margin-top: 14px;
    animation: slideUp 1.2s ease-out both;
    animation-delay: 0.3s;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }

  /* 시작하기 버튼 */
  .start-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 17px 60px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-decoration: none;
    border-radius: 60px;
    background: linear-gradient(100deg, #0a1f44, #1e3a6e, #ffc94a, #0a1f44);
    background-size: 260% 100%;
    box-shadow: 0 12px 30px rgba(10,31,68,0.3);
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
    animation: slideUp 1.2s ease-out both;
    animation-delay: 0.6s;
    cursor: pointer;
    border: none;
  }
  .start-btn:hover {
    transform: translateY(-5px) scale(1.04);
    background-position: 100% 0;
    box-shadow: 0 18px 45px rgba(10,31,68,0.4);
  }
  .start-btn:active { transform: scale(0.96); }

  .start-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -120%; }
    50%, 100% { left: 140%; }
  }

  .scroll-hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(219,228,255,0.6);
    font-size: 12px;
    letter-spacing: 4px;
    animation: bounceHint 2s infinite;
    z-index: 10;
  }
  @keyframes bounceHint {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <svg class="campus-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="nebulaA">
        <stop offset="0" stop-color="rgba(88,72,190,0.35)"/>
        <stop offset="1" stop-color="rgba(88,72,190,0)"/>
      </radialGradient>
      <radialGradient id="nebulaB">
        <stop offset="0" stop-color="rgba(52,90,170,0.4)"/>
        <stop offset="1" stop-color="rgba(52,90,170,0)"/>
      </radialGradient>
      <radialGradient id="planetGrad">
        <stop offset="0" stop-color="#4a6fb5"/>
        <stop offset="1" stop-color="#0a1f44"/>
      </radialGradient>
      <linearGradient id="starTrail" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="rgba(255,255,255,0)"/>
        <stop offset="1" stop-color="rgba(219,228,255,0.95)"/>
      </linearGradient>
    </defs>

    <!-- 성운 -->
    <ellipse cx="240" cy="190" rx="430" ry="270" fill="url(#nebulaA)"/>
    <ellipse cx="1180" cy="560" rx="480" ry="300" fill="url(#nebulaB)"/>
    <ellipse cx="720" cy="850" rx="520" ry="260" fill="url(#nebulaA)" opacity="0.6"/>

    <!-- 은하수 띠 -->
    <ellipse cx="720" cy="420" rx="760" ry="130" fill="rgba(176,196,255,0.07)" transform="rotate(-14 720 420)"/>

    <!-- 별자리 (큰 별) -->
    <g fill="rgba(255,255,255,0.95)">
      <circle cx="120" cy="120" r="2.4"/>
      <circle cx="330" cy="70" r="1.8"/>
      <circle cx="520" cy="180" r="2.6"/>
      <circle cx="760" cy="90" r="2"/>
      <circle cx="960" cy="150" r="2.8"/>
      <circle cx="1120" cy="70" r="2.2"/>
      <circle cx="1330" cy="140" r="2.5"/>
      <circle cx="1420" cy="60" r="1.8"/>
    </g>

    <!-- 반짝이는 별 -->
    <g fill="rgba(176,196,255,0.85)">
      <circle cx="200" cy="60" r="1.6"/>
      <circle cx="420" cy="300" r="1.5"/>
      <circle cx="640" cy="520" r="1.7"/>
      <circle cx="860" cy="260" r="1.5"/>
      <circle cx="1050" cy="400" r="1.8"/>
      <circle cx="1270" cy="300" r="1.5"/>
      <circle cx="1400" cy="460" r="1.6"/>
      <circle cx="80" cy="420" r="1.5"/>
    </g>

    <!-- 일반 별들 -->
    <g fill="rgba(255,255,255,0.7)">
      <circle cx="60" cy="220" r="1.1"/>
      <circle cx="160" cy="340" r="1"/>
      <circle cx="260" cy="160" r="1.2"/>
      <circle cx="300" cy="420" r="1"/>
      <circle cx="380" cy="120" r="1.2"/>
      <circle cx="470" cy="260" r="1"/>
      <circle cx="580" cy="110" r="1.1"/>
      <circle cx="600" cy="350" r="1.2"/>
      <circle cx="700" cy="230" r="1"/>
      <circle cx="820" cy="380" r="1.1"/>
      <circle cx="900" cy="500" r="1"/>
      <circle cx="990" cy="90" r="1.2"/>
      <circle cx="1000" cy="300" r="1"/>
      <circle cx="1100" cy="240" r="1.1"/>
      <circle cx="1200" cy="120" r="1"/>
      <circle cx="1240" cy="440" r="1.1"/>
      <circle cx="1330" cy="250" r="1.2"/>
      <circle cx="1430" cy="300" r="1"/>
      <circle cx="50" cy="620" r="1.1"/>
      <circle cx="170" cy="700" r="1"/>
      <circle cx="280" cy="580" r="1.2"/>
      <circle cx="430" cy="500" r="1"/>
      <circle cx="530" cy="650" r="1.1"/>
      <circle cx="660" cy="620" r="1"/>
      <circle cx="780" cy="560" r="1.2"/>
      <circle cx="900" cy="680" r="1"/>
      <circle cx="1020" cy="600" r="1.1"/>
      <circle cx="1140" cy="520" r="1"/>
      <circle cx="1280" cy="620" r="1.2"/>
      <circle cx="1380" cy="580" r="1"/>
      <circle cx="120" cy="800" r="1.1"/>
      <circle cx="340" cy="740" r="1"/>
      <circle cx="560" cy="780" r="1.2"/>
      <circle cx="750" cy="740" r="1"/>
      <circle cx="960" cy="800" r="1.1"/>
      <circle cx="1170" cy="720" r="1"/>
      <circle cx="1350" cy="770" r="1.1"/>
      <circle cx="1420" cy="860" r="1.2"/>
      <circle cx="40" cy="870" r="1"/>
    </g>

    <!-- 고리 행성 (우측 상단) -->
    <g transform="rotate(-18 1180 170)">
      <ellipse cx="1180" cy="170" rx="130" ry="36" fill="none" stroke="rgba(176,196,255,0.55)" stroke-width="7"/>
      <circle cx="1180" cy="170" r="60" fill="url(#planetGrad)"/>
      <circle cx="1165" cy="156" r="20" fill="rgba(219,228,255,0.45)"/>
    </g>

    <!-- 작은 달 (좌측 하단) -->
    <g>
      <circle cx="230" cy="720" r="36" fill="#1e3a6e"/>
      <circle cx="219" cy="709" r="11" fill="rgba(219,228,255,0.4)"/>
      <circle cx="242" cy="726" r="6" fill="rgba(219,228,255,0.3)"/>
      <circle cx="252" cy="705" r="4" fill="rgba(219,228,255,0.25)"/>
    </g>

    <!-- 별똥별 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-430 310" dur="6s" repeatCount="indefinite"/>
      <line x1="1090" y1="300" x2="1010" y2="380" stroke="url(#starTrail)" stroke-width="3" stroke-linecap="round">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.78;0.84;0.95" dur="6s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>

  <div class="content">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring ring2"></div>
      <img class="logo" src="핀스킨 로고.png" alt="PINSKIN 로고">
    </div>
    <h1 class="club-name">PINSKIN</h1>
    <p class="tagline">경상국립대학교 중앙동아리 소속<br>공모전 동아리</p>
    <br>
    <a class="start-btn" href="main.html">PINSKIN 시작하기</a>
  </div>

  <div class="scroll-hint">SCROLL TO BEGIN</div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }

    // 입자 생성
    const body = document.body;
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.width = p.style.height = (Math.random() * 5 + 2) + 'px';
      p.style.animationDuration = (Math.random() * 12 + 8) + 's';
      p.style.animationDelay = (Math.random() * 12) + 's';
      body.appendChild(p);
    }
  </script>
</body>
</html>
