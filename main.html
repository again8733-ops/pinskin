<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN 메뉴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #1e3a6e;
  }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    overflow-x: hidden;
    position: relative;
    padding: 60px 20px;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    animation: floatBlob 16s ease-in-out infinite;
  }
  .blob1 { width: 40vw; height: 40vw; background: #dbe4ff; top: -10%; left: -10%; opacity: 0.9; }
  .blob2 { width: 35vw; height: 35vw; background: #cddcff; bottom: -10%; right: -5%; opacity: 0.85; animation-delay: -6s; }
  .blob3 { width: 25vw; height: 25vw; background: #f0e6ff; top: 50%; left: 60%; opacity: 0.7; animation-delay: -10s; }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.1); }
    66% { transform: translate(-4vw, 4vh) scale(0.92); }
  }

  .wrap { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 70px; animation: fadeDown 1s ease-out both; }

  .mini-logo {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    border: 3px solid #ffffff;
    box-shadow: 0 0 30px rgba(10,31,68,0.25), 0 12px 30px rgba(10,31,68,0.2);
    animation: logoFloat 4s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .title {
    font-size: 42px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #0a1f44, #1e3a6e, #4a6fb5, #0a1f44);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradientMove 6s linear infinite;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .subtitle { color: var(--navy-soft); letter-spacing: 6px; margin-top: 10px; font-size: 14px; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    justify-content: center;
  }

  .menu-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 230px;
    padding: 40px 25px;
    border-radius: 24px;
    text-decoration: none;
    overflow: hidden;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(10,31,68,0.12);
    box-shadow: 0 12px 35px rgba(10,31,68,0.1);
    backdrop-filter: blur(10px);
    transition: transform 0.35s cubic-bezier(0.2,0.8,0.3,1), box-shadow 0.35s ease, border-color 0.35s ease;
    animation: cardIn 0.9s ease-out both;
  }
  .menu-card:nth-child(1) { animation-delay: 0.15s; }
  .menu-card:nth-child(2) { animation-delay: 0.35s; }
  .menu-card:nth-child(3) { animation-delay: 0.55s; }
  .menu-card:nth-child(4) { animation-delay: 0.75s; }
  .menu-card:nth-child(5) { animation-delay: 0.95s; }
  .menu-card:nth-child(6) { animation-delay: 1.15s; }
  .menu-card:nth-child(7) { animation-delay: 1.35s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .menu-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    opacity: 0.1;
    transition: opacity 0.35s ease;
  }
  .menu-card:hover::before { opacity: 0.22; }

  .menu-card:hover {
    transform: translateY(-12px);
    box-shadow: 0 0 45px var(--glow), 0 18px 40px rgba(10,31,68,0.15);
    border-color: var(--c1);
  }

  .icon {
    font-size: 58px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 18px var(--glow));
    animation: iconFloat 3.5s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-4deg); }
  }

  .menu-label {
    font-size: 21px; font-weight: 900; letter-spacing: 1px; color: var(--navy);
    text-shadow: 0 2px 10px rgba(255,255,255,0.6);
  }
  .menu-sub {
    margin-top: 8px; font-size: 13px; color: var(--navy-soft); letter-spacing: 2px;
  }

  .menu-arrow {
    position: absolute;
    bottom: 16px; right: 20px;
    font-size: 22px; color: rgba(10,31,68,0.35);
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .menu-card:hover .menu-arrow { transform: translateX(6px); color: var(--navy); }

  .soon {
    opacity: 0.85;
    cursor: default;
  }
  .soon .icon { filter: grayscale(0.3); animation: none; }
  .soon-tag {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #0a1f44;
    background: linear-gradient(90deg, #ffd54a, #ffb347);
    padding: 5px 12px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(255,213,74,0.5);
  }

  .back-btn {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 20;
    color: var(--navy);
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 18px;
    border-radius: 40px;
    border: 1px solid rgba(10,31,68,0.25);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .back-btn:hover { color: #fff; background: var(--navy); border-color: var(--navy); transform: translateX(-4px); }

  /* 폭죽 애니메이션 캔버스 */
  #fireworksCanvas {
    position: fixed;
    inset: 0;
    z-index: 150;
    pointer-events: none;
  }

  /* 비밀번호 잠금 화면 */
  .lock-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff;
    overflow: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .lock-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }

  .lock-box {
    position: relative; z-index: 10;
    width: min(90vw, 420px);
    text-align: center;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 45px 40px 40px;
    border: 1px solid rgba(10,31,68,0.12);
    box-shadow: 0 30px 80px rgba(10,31,68,0.18);
    animation: popIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .lock-box.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .lock-icon {
    width: 84px; height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #0a1f44, #1e3a6e);
    box-shadow: 0 12px 30px rgba(10,31,68,0.35);
    animation: lockFloat 3.5s ease-in-out infinite;
  }
  @keyframes lockFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .lock-title {
    font-size: 26px; font-weight: 900; letter-spacing: 2px; color: var(--navy);
  }
  .lock-sub {
    margin-top: 8px; font-size: 13px; color: var(--navy-soft); letter-spacing: 2px;
  }

  .pw-wrap { position: relative; margin-top: 28px; }
  .pw-input {
    width: 100%;
    padding: 16px 20px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 6px;
    text-align: center;
    color: var(--navy);
    background: #f3f6ff;
    border: 2px solid rgba(10,31,68,0.18);
    border-radius: 16px;
    outline: none;
    transition: all 0.3s ease;
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
  }
  .pw-input:focus {
    border-color: var(--navy);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(10,31,68,0.1);
  }

  .pw-hint {
    margin-top: 10px;
    font-size: 12px;
    color: rgba(10,31,68,0.5);
    letter-spacing: 1px;
  }
  .error-msg {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #e74c3c;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .error-msg.show { opacity: 1; }

  .login-btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(100deg, #0a1f44, #1e3a6e, #ffc94a, #0a1f44);
    background-size: 260% 100%;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(10,31,68,0.3);
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .login-btn:hover { background-position: 100% 0; transform: translateY(-3px); box-shadow: 0 16px 40px rgba(10,31,68,0.4); }
  .login-btn:active { transform: scale(0.97); }
  .login-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .login-btn::before {
    content: '';
    position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -120%; }
    50%, 100% { left: 140%; }
  }

  @media (max-width: 700px) {
    .title { font-size: 32px; }
    .menu-card { min-height: 190px; }
    .lock-box { padding: 34px 24px 30px; }
  }
</style>
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>

  <div class="lock-screen" id="lockScreen">

  <script>
    (function () {
      var HASH = 'bdcec6b82751839d4c6248a3a6bad29c96e957a1f05ce120ce14f4fadd7eae3e';
      var screen = document.getElementById('lockScreen');
      var box = document.getElementById('lockBox');
      var input = document.getElementById('pwInput');
      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('errorMsg');

      function toHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }

      function sha256(str) {
        if (window.crypto && crypto.subtle) {
          return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(toHex);
        }
        return Promise.reject(new Error('no-crypto'));
      }

      function unlock() {
        screen.classList.add('done');
        btn.disabled = false;
      }

      function fail() {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        err.classList.add('show');
        input.value = '';
        input.focus();
        btn.disabled = false;
      }

      function enter() {
        var v = input.value.trim();
        if (!v) { input.focus(); return; }
        btn.disabled = true;
        err.classList.remove('show');
        sha256(v).then(function (h) {
          if (h === HASH) {
            sessionStorage.setItem('pinskin_auth', 'yes');
            unlock();
          } else {
            fail();
          }
        }).catch(fail);
      }

      if (sessionStorage.getItem('pinskin_auth') === 'yes') {
        unlock();
      } else {
        btn.addEventListener('click', enter);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') enter();
        });
        input.addEventListener('input', function () { err.classList.remove('show'); });
        input.focus();
      }
    })();
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('fireworksCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var W = 0, H = 0, dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      var COLORS = ['#ff2d95', '#00d4ff', '#ffc94a', '#7b2dff', '#4da8ff', '#ff6b9d', '#ff9f45', '#ff5e8a'];
      var particles = [];
      var rockets = [];

      function rand(a, b) { return a + Math.random() * (b - a); }

      function addBurst(x, y, color, scale) {
        var count = Math.round(rand(26, 60) * scale);
        for (var i = 0; i < count; i++) {
          var angle = rand(0, Math.PI * 2);
          var speed = rand(1.2, 5.2) * scale;
          particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0,
            maxLife: Math.round(rand(45, 90)),
            size: rand(1.2, 3.2) * scale,
            color: color,
            drag: 0.985
          });
        }
      }

      function addRocket() {
        var fromLeft = Math.random() < 0.5;
        rockets.push({
          x: fromLeft ? rand(0, W * 0.3) : rand(W * 0.7, W),
          y: H + 10,
          targetY: rand(H * 0.12, H * 0.5),
          speed: rand(9, 14),
          vx: (fromLeft ? 1 : -1) * rand(0.4, 1.6),
          trail: []
        });
      }

      function fireworkAtRandom() {
        var kind = Math.random();
        var color = COLORS[Math.floor(Math.random() * COLORS.length)];
        var scale = Math.random() < 0.25
          ? rand(1.7, 2.3)
          : (Math.random() < 0.5 ? rand(1, 1.4) : rand(0.55, 0.95));
        if (kind < 0.4) {
          addRocket();
        } else {
          var x = rand(W * 0.15, W * 0.85);
          var y = rand(H * 0.1, H * 0.58);
          addBurst(x, y, color, scale);
          if (Math.random() < 0.35) {
            setTimeout(function () {
              addBurst(x + rand(-45, 45), y + rand(-45, 45), COLORS[Math.floor(Math.random() * COLORS.length)], scale * rand(0.5, 0.8));
            }, rand(40, 130));
          }
        }
      }

      var launchTimer = 0;
      var last = performance.now();

      function loop(now) {
        var dt = Math.min((now - last) / 16.7, 3);
        last = now;

        ctx.clearRect(0, 0, W, H);

        for (var i = rockets.length - 1; i >= 0; i--) {
          var r = rockets[i];
          r.y -= r.speed * dt;
          r.x += r.vx * dt;
          r.trail.push({ x: r.x, y: r.y });
          if (r.trail.length > 8) r.trail.shift();
          if (r.y <= r.targetY) {
            addBurst(r.x, r.y, COLORS[Math.floor(Math.random() * COLORS.length)], rand(1, 1.8));
            rockets.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#ffd54a';
          ctx.beginPath();
          ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          for (var t = 0; t < r.trail.length; t++) {
            var tp = r.trail[t];
            ctx.globalAlpha = (t + 1) / r.trail.length * 0.55;
            ctx.fillStyle = '#ffc94a';
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, (t + 1) * 0.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.life++;
          pt.vx *= pt.drag;
          pt.vy = pt.vy * pt.drag + 0.045;
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          var lifeRatio = 1 - pt.life / pt.maxLife;
          if (lifeRatio <= 0) { particles.splice(p, 1); continue; }
          ctx.globalAlpha = Math.min(1, lifeRatio * 1.4);
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size * lifeRatio + 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;

        launchTimer += dt;
        if (launchTimer > 40) {
          launchTimer = 0;
          fireworkAtRandom();
        }

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
