<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN - 준비 중</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', 'Poppins', sans-serif;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1a0b2e 0%, #0d0520 45%, #070312 100%);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .blob {
    position: absolute; border-radius: 50%; filter: blur(100px);
    opacity: 0.35; animation: floatBlob 16s ease-in-out infinite; pointer-events: none;
  }
  .blob1 { width: 40vw; height: 40vw; background: #ff2d95; top: -10%; left: -10%; }
  .blob2 { width: 35vw; height: 35vw; background: #7b2dff; bottom: -10%; right: -5%; animation-delay: -6s; }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5vw, -5vh) scale(1.1); }
    66% { transform: translate(-4vw, 4vh) scale(0.92); }
  }

  .wrap { position: relative; z-index: 10; text-align: center; animation: popIn 0.8s cubic-bezier(0.2,0.8,0.3,1) both; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .icon {
    font-size: 90px;
    filter: drop-shadow(0 0 25px rgba(255,213,74,0.6));
    animation: swing 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .title {
    margin-top: 30px;
    font-size: 40px; font-weight: 900; letter-spacing: 4px; color: #fff;
    text-shadow: 0 4px 30px rgba(255,45,149,0.4);
  }
  .sub {
    margin-top: 14px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 3px;
    font-size: 15px;
  }

  .back-btn {
    display: inline-block;
    margin-top: 45px;
    padding: 14px 42px;
    font-size: 16px; font-weight: 900; letter-spacing: 2px;
    color: #fff; text-decoration: none;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .back-btn:hover {
    background: linear-gradient(90deg, #ff2d95, #7b2dff);
    border-color: transparent;
    transform: translateY(-4px);
    box-shadow: 0 0 35px rgba(255,45,149,0.5);
  }

  .dot-bounce span {
    display: inline-block;
    width: 9px; height: 9px; margin: 0 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2d95, #00d4ff);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot-bounce span:nth-child(2) { animation-delay: 0.15s; }
  .dot-bounce span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-14px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="wrap">
    <div class="icon">🚧</div>
    <h1 class="title">COMING SOON</h1>
    <p class="sub">새로운 메뉴를 준비하고 있어요</p>
    <div class="dot-bounce" style="margin-top: 26px;">
      <span></span><span></span><span></span>
    </div>
    <br>
    <a class="back-btn" href="main.html">메뉴로 돌아가기</a>
  </div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }
  </script>
</body>
</html>
