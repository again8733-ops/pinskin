<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINSKIN 운영진 회의록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1f44;
    --navy-soft: #4a5d84;
    --blue: #3d63ff;
    --line: #e3e7ef;
    --paper: #f7f8fb;
  }

  body {
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    background: var(--paper);
    overflow-x: hidden;
    padding: 64px 20px 100px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(10,31,68,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 0%, black, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 10; max-width: 900px; margin: 0 auto; }

  .back-btn {
    position: fixed; top: 22px; left: 22px; z-index: 20;
    color: var(--navy); text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 10px 18px 10px 14px; border-radius: 100px;
    border: 2px solid var(--navy); background: #fff;
    transition: all 0.25s ease;
  }
  .back-btn:hover { color: #fff; background: var(--navy); transform: translateX(-3px); }

  .header { text-align: center; margin-bottom: 8px; animation: fadeDown 0.8s ease-out both; }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 100px;
    background: var(--navy); color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
    margin-bottom: 22px;
  }
  .badge-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 58px; font-weight: 900; letter-spacing: -2px;
    color: var(--navy); text-transform: uppercase; line-height: 1;
  }
  .title span { color: var(--blue); }

  .subtitle { color: var(--navy-soft); margin-top: 16px; font-size: 15px; font-weight: 500; }

  .bg-logo {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(60vw, 480px); height: min(60vw, 480px);
    border-radius: 50%; object-fit: cover; opacity: 0.04;
    filter: grayscale(1) contrast(1.1); pointer-events: none; z-index: 0;
  }

  /* 비어있는 상태 카드 */
  .empty-card {
    margin-top: 44px;
    border-radius: 20px;
    padding: 56px 30px;
    background: #ffffff;
    border: 2px dashed var(--line);
    text-align: center;
    animation: cardIn 0.7s ease-out both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .empty-icon {
    width: 60px; height: 60px; margin: 0 auto 20px;
    border-radius: 14px;
    background: var(--navy);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px;
  }
  .empty-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700; color: var(--navy);
  }
  .empty-sub {
    margin-top: 10px; font-size: 14.5px; color: var(--navy-soft); line-height: 1.7;
  }

  /* 회의록 목록 (내용 추가 시 사용) */
  .minutes-list { display: flex; flex-direction: column; gap: 16px; margin-top: 44px; }
  .minute-card {
    border-radius: 18px;
    padding: 24px 26px;
    background: #ffffff;
    border: 2px solid var(--navy);
    box-shadow: 6px 6px 0 var(--navy);
    transition: transform 0.25s cubic-bezier(0.2,0.8,0.3,1), box-shadow 0.25s ease;
  }
  .minute-card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0 var(--blue); }
  .minute-date {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: #fff; background: var(--blue);
    display: inline-block; padding: 4px 12px; border-radius: 100px;
  }
  .minute-title { margin-top: 12px; font-size: 18px; font-weight: 700; color: var(--navy); }
  .minute-desc { margin-top: 6px; font-size: 14.5px; color: var(--navy-soft); line-height: 1.7; }

  .minute-card.pending {
    border-style: dashed;
    box-shadow: none;
    background: var(--paper);
  }
  .minute-card.pending:hover { transform: none; box-shadow: none; }
  .minute-date.pending { background: var(--navy-soft); }
  .minute-agenda {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    list-style: none;
  }
  .minute-agenda li {
    position: relative;
    padding: 6px 0 6px 18px;
    font-size: 14.5px; color: var(--navy-soft); line-height: 1.7;
  }
  .minute-agenda li::before {
    content: ''; position: absolute; left: 2px; top: 15px;
    width: 6px; height: 6px; border-radius: 2px; background: var(--blue);
  }

  /* ===== 2차 비밀번호 잠금 화면 ===== */
  .lock-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,20,44,0.6);
    backdrop-filter: blur(10px);
    padding: 20px;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .lock-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }

  .lock-box {
    position: relative;
    width: min(90vw, 400px);
    text-align: center;
    background: #ffffff;
    border-radius: 24px;
    padding: 44px 36px 38px;
    border: 2px solid var(--navy);
    box-shadow: 10px 10px 0 var(--blue);
    animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .lock-box.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }

  .lock-icon {
    width: 62px; height: 62px; margin: 0 auto 18px;
    border-radius: 14px;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
  }
  .lock-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 900; letter-spacing: -0.3px; color: var(--navy);
  }
  .lock-sub { margin-top: 8px; font-size: 13px; color: var(--navy-soft); font-weight: 500; }

  .pw-wrap { margin-top: 24px; }
  .pw-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px; font-weight: 700; letter-spacing: 5px;
    text-align: center;
    color: var(--navy);
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s ease;
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }
  .pw-input:focus { border-color: var(--navy); background: #fff; }

  .error-msg {
    margin-top: 10px; font-size: 12.5px; font-weight: 700; color: #e0475c;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .error-msg.show { opacity: 1; }

  .login-btn {
    display: block; width: 100%; margin-top: 18px; padding: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    color: #fff; background: var(--navy);
    border: 2px solid var(--navy); border-radius: 12px;
    cursor: pointer; text-transform: uppercase;
    transition: all 0.25s ease;
  }
  .login-btn:hover { background: var(--blue); border-color: var(--blue); transform: translateY(-2px); }
  .login-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  @media (max-width: 700px) {
    .title { font-size: 38px; }
    .empty-card { padding: 44px 22px; }
  }
</style>
</head>
<body>
  <img class="bg-logo" src="핀스킨 로고.png" alt="">

  <a class="back-btn" href="main.html">← BACK</a>

  <div class="wrap">
    <div class="header">
      <div class="badge-pill"><span class="dot"></span>PINSKIN CLUB</div>
      <h1 class="title">MEETING<span>.</span>MINUTES</h1>
      <p class="subtitle">운영진 회의록</p>
    </div>

    <div class="minutes-list">
      <div class="minute-card pending">
        <span class="minute-date pending">2026.08.23 · 예정</span>
        <div class="minute-title">운영진 회의</div>
        <p class="minute-desc">오늘 저녁 회의가 예정되어 있습니다. 회의가 끝나면 자료를 전달해주세요 — 안건과 결정 사항을 정리해서 이 카드에 채워 넣습니다.</p>
      </div>
    </div>
  </div>

  <div class="lock-screen" id="minutesLock">
    <div class="lock-box" id="minutesLockBox">
      <div class="lock-icon">MM</div>
      <h1 class="lock-title">운영진 전용</h1>
      <p class="lock-sub">회의록 비밀번호를 입력해주세요</p>

      <div class="pw-wrap">
        <input class="pw-input" id="minutesPwInput" type="password" placeholder="••••••••••" autocomplete="off" maxlength="30">
      </div>
      <p class="error-msg" id="minutesErrorMsg">비밀번호가 올바르지 않습니다</p>

      <button class="login-btn" id="minutesLoginBtn">ENTER →</button>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('pinskin_auth') !== 'yes') { location.replace('index.html'); }
  </script>

  <script>
    (function () {
      var HASH = '0e1fd4dbd0528a347b0fa6d55ed076989169083bf7b16c82b9cc9c1bff11c0a5';
      var screen = document.getElementById('minutesLock');
      var box = document.getElementById('minutesLockBox');
      var input = document.getElementById('minutesPwInput');
      var btn = document.getElementById('minutesLoginBtn');
      var err = document.getElementById('minutesErrorMsg');

      function toHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }

      function sha256(str) {
        if (window.crypto && crypto.subtle) {
          return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(toHex);
        }
        return Promise.reject(new Error('no-crypto'));
      }

      function unlock() {
        screen.classList.add('done');
      }

      function fail() {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        err.classList.add('show');
        input.value = '';
        input.focus();
        btn.disabled = false;
      }

      function enter() {
        var v = input.value.trim();
        if (!v) { input.focus(); return; }
        btn.disabled = true;
        err.classList.remove('show');
        sha256(v).then(function (h) {
          if (h === HASH) {
            sessionStorage.setItem('pinskin_minutes_auth', 'yes');
            unlock();
          } else {
            fail();
          }
        }).catch(fail);
      }

      if (sessionStorage.getItem('pinskin_minutes_auth') === 'yes') {
        unlock();
      } else {
        btn.addEventListener('click', enter);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') enter();
        });
        input.addEventListener('input', function () { err.classList.remove('show'); });
        input.focus();
      }
    })();
  </script>
</body>
</html>
